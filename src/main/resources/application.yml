server:
  port: 8005

spring:
  application:
    name: msvc-inventory
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/gamehub_inventario}
  data:
    mongodb:
      auto-index-creation: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs/swagger-ui.html
